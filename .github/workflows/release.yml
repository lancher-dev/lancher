name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          export CGO_ENABLED=0
          LDFLAGS="-s -w -X github.com/lancher-dev/lancher/internal/version.Version=${VERSION}"

          # Build for all platforms
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o lancher-linux-amd64 ./cmd/lancher
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o lancher-linux-arm64 ./cmd/lancher
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o lancher-darwin-amd64 ./cmd/lancher
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o lancher-darwin-arm64 ./cmd/lancher

      - name: Generate shell completions
        run: |
          mkdir completions
          for SHELL_NAME in bash zsh fish; do
            ./lancher-linux-amd64 completion "$SHELL_NAME" > "completions/lancher.$SHELL_NAME"
          done

      - name: Build .deb packages
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Debian sorts "~" before the empty string: 0.3.1~rc.1 < 0.3.1.
          DEB_VERSION=$(printf '%s' "$VERSION" | tr '-' '~')

          for ARCH in amd64 arm64; do
            ROOT=deb-${ARCH}
            mkdir -p ${ROOT}/DEBIAN
            install -Dm755 lancher-linux-${ARCH} ${ROOT}/usr/bin/lancher
            install -Dm644 completions/lancher.bash ${ROOT}/usr/share/bash-completion/completions/lancher
            install -Dm644 completions/lancher.zsh ${ROOT}/usr/share/zsh/vendor-completions/_lancher
            install -Dm644 completions/lancher.fish ${ROOT}/usr/share/fish/vendor_completions.d/lancher.fish

            INSTALLED_SIZE=$(du -sk ${ROOT}/usr | awk '{print $1}')

            cat > ${ROOT}/DEBIAN/control << EOF
          Package: lancher
          Version: ${DEB_VERSION}
          Architecture: ${ARCH}
          Maintainer: Kasui92 <info@lucapattocchio.dev>
          Installed-Size: ${INSTALLED_SIZE}
          Homepage: https://lancher.dev
          Description: A minimal, local project-template manager written in Go.
          EOF

            dpkg-deb --build --root-owner-group ${ROOT} "lancher_${VERSION}_${ARCH}.deb"
          done

      - name: Generate checksums
        id: checksums
        run: |
          sha256sum lancher-linux-amd64 lancher-linux-arm64 lancher-darwin-amd64 lancher-darwin-arm64 lancher_*.deb > checksums.txt
          {
            echo "checksums<<EOF"
            cat checksums.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            lancher-linux-amd64
            lancher-linux-arm64
            lancher-darwin-amd64
            lancher-darwin-arm64
            lancher_*.deb
            checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          append_body: true
          body: |

            <details>
            <summary>Checksums (SHA256)</summary>

            ```
            ${{ steps.checksums.outputs.checksums }}
            ```

            </details>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

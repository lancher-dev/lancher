name: Publish to AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    # Tags with a suffix (v1.2.3-rc.1) are pre-releases and stay on GitHub only.
    if: ${{ github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get version
        id: version
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${TAG#v}"
          if [ -z "${VERSION}" ]; then
            echo "ERROR: could not determine version from workflow_run event" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Deploying version: ${VERSION}"

      - name: Download release binaries
        run: |
          VERSION=${{ steps.version.outputs.version }}
          wget -q "https://github.com/lancher-dev/lancher/releases/download/v${VERSION}/lancher-linux-amd64"
          wget -q "https://github.com/lancher-dev/lancher/releases/download/v${VERSION}/lancher-linux-arm64"

      - name: Calculate checksums
        id: checksums
        run: |
          echo "sha256_x86_64=$(sha256sum lancher-linux-amd64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha256_aarch64=$(sha256sum lancher-linux-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256_X86_64: ${{ steps.checksums.outputs.sha256_x86_64 }}
          SHA256_AARCH64: ${{ steps.checksums.outputs.sha256_aarch64 }}
        run: |
          # shellcheck disable=SC2016
          envsubst '$VERSION $SHA256_X86_64 $SHA256_AARCH64' < packaging/aur/PKGBUILD.tpl > PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: lancher
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ steps.version.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519